<!--Updates page for mission website-->
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================================
    BASIC PAGE INFORMATION
    =========================================================== -->

    <!-- Tells the browser this page uses modern HTML -->
    <meta charset="UTF-8">

    <!-- Makes the website display properly on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Text shown in the browser tab -->
    <title>About Us | Schultz Mission</title>

    <!-- ==========================================================
    SHARED WEBSITE CSS
    This is the same CSS file used by the main page.
    =========================================================== -->

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- ==========================================================
    WEBSITE HEADER
    ===========================================================

    This header will appear on the other pages of the website too.

    The goal is to give visitors a consistent way to move around
    the website regardless of which page they are currently viewing.

    Navigation:

        Home      -> returns to the main traffic-hub page
        About Us  -> current page
        Updates   -> takes visitors to past ministry updates
        Give      -> takes visitors to the external giving page

    =========================================================== -->

    <header class="site-header">

        <!-- Website / Ministry Name -->
        <!-- removing the title for now...
        <div class="site-title">
            <a href="index.html">
                Schultz Mission
            </a>
        </div>
        -->

        <!-- ======================================================
        MAIN WEBSITE NAVIGATION

        These are links to OTHER PAGES or IMPORTANT DESTINATIONS.

        Because all of these files are part of the same website,
        we can link to them using their filenames.

        Example:

            href="index.html"

        means:

            "Go to index.html in this same website."

        ======================================================= -->

        <nav class="site-nav">

            <!-- HOME -->
            <a href="index.html">
                Home
            </a>


            <!-- ABOUT US -->

            <!--
            This is the page we are currently on.
            -->
            <a href="about.html">
                About Us
            </a>


            <!-- UPDATES -->

            <!--
            This page does not have to exist yet.

            Later we can create:

                updates.html

            and this link will take visitors there.
            -->
            <a class="active">
                Updates
            </a>


            <!-- GIVE -->

            <!--
            This is NOT another page on our website.

            Instead, it sends the visitor directly to the
            external giving page.

            target="_blank" opens the giving page in a new tab.

            rel="noopener" is a security best practice when
            opening an external website in a new tab.
            -->
            <a class="nav-give"
               href="https://give.team.org/fundraiser/6492006"
               target="_blank"
               rel="noopener">

                Give

            </a>

        </nav>

    </header>


    <!-- ==========================================================
    MAIN PAGE CONTENT
    ===========================================================

    Everything specific to the About Us page goes inside <main>.

    This helps keep the website organized and is good semantic HTML.

    =========================================================== -->

    <main class="updates-page">

        <p>
            &ensp;&ensp;&ensp;&ensp;Previous email updates will be posted here soon
        </p>

    </main>


    <!-- ==========================================================
    FOOTER
    ===========================================================

    The footer can eventually be shared across all pages.

    It provides another place for visitors to find contact
    information.

    =========================================================== -->

    <footer>

        <p class="contact">

            Contact:

            <a href="mailto:benandbriannaschultz@gmail.com">
                benandbriannaschultz@gmail.com
            </a>

        </p>

    </footer>


</body>
</html>
